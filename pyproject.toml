[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office"
version = "0.2.0"
description = "Club register: the club office for membership, payments and bookable events"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "email-validator>=2.2.0",
  "uvicorn>=0.35.0",
  "sqlalchemy>=2.0.35",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "mypy>=1.12.0",
  "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = ["S101", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
warn_unused_configs = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]
