{% extends "base.html" %}
{% block title %}Finance settings{% endblock %}
{% block content %}
<h1>Finance</h1>
{% include "_finance_nav.html" %}
<h2>Invoice settings</h2>
<form method="post" action="/app/finance/settings" class="form" style="max-width:620px">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Club name<input type="text" name="club_name" value="{{ s.club_name }}"></label>
  <label>Club address (shown on invoices)<textarea name="club_address" rows="3">{{ s.club_address }}</textarea></label>
  <label>Payment terms (days)<input type="number" name="invoice_terms_days" min="0" value="{{ s.invoice_terms_days }}"></label>
  <label>How to pay<textarea name="payment_instructions" rows="3" placeholder="e.g. Pay by bank transfer quoting your invoice number.">{{ s.payment_instructions }}</textarea></label>
  <label>Bank details<textarea name="bank_details" rows="3" placeholder="Account name, sort code, account number">{{ s.bank_details }}</textarea></label>
  <label>Default message on every invoice<textarea name="invoice_message" rows="2" placeholder="e.g. Thank you for supporting the club.">{{ s.invoice_message }}</textarea></label>
  <label>Invoice footer<textarea name="invoice_footer" rows="2" placeholder="e.g. Registered charity no.">{{ s.invoice_footer }}</textarea></label>
  <label>Financial year starts in
    <select name="fy_start_month">{% for n, name in [(1,"January"),(2,"February"),(3,"March"),(4,"April"),(5,"May"),(6,"June"),(7,"July"),(8,"August"),(9,"September"),(10,"October"),(11,"November"),(12,"December")] %}<option value="{{ n }}" {{ "selected" if s.fy_start_month|string == n|string }}>{{ name }}</option>{% endfor %}</select></label>
  <label>Members can renew online from (months before their membership ends)<input type="number" name="renewal_window_months" min="0" max="12" value="{{ s.renewal_window_months }}"></label>
  <label>Lapse a renewal that is still unpaid after (days overdue)<input type="number" name="lapse_after_days" min="0" max="365" value="{{ s.lapse_after_days }}"></label>
  <label>Season invoices
    <select name="season_invoice_mode"><option value="combined" {{ "selected" if s.season_invoice_mode == "combined" }}>One invoice per payer: membership, boat park and extras together</option><option value="separate" {{ "selected" if s.season_invoice_mode == "separate" }}>Separate invoices for membership, boat park and extras</option></select></label>
  <label>Reply-to address for invoice emails<input type="email" name="reply_to" value="{{ s.reply_to }}"></label>
  <button type="submit">Save settings</button>
</form>
{% endblock %}
